name: Regenerate assembly and MCA

on:
  push:
    branches:
      - develop
      - test
      - ci/github-actions
  workflow_dispatch:

permissions:
  contents: write

# All trigger branches publish to test, so serialize runs to avoid racing pushes.
concurrency:
  group: cgx-data-regenerate-assembly
  cancel-in-progress: false

jobs:
  regenerate:
    # Prevent a bot-generated commit from starting another generation run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pushed CGX-data branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          path: CGX-data
          persist-credentials: false

      - name: Checkout CGX
        uses: actions/checkout@v7.0.1
        with:
          repository: yy981-jp/CGX
          ref: develop
          path: CGX
          persist-credentials: false

      - name: Checkout test branch for generated output
        uses: actions/checkout@v7.0.1
        with:
          ref: test
          path: CGX-data-test
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            g++ \
            g++-x86-64-linux-gnu \
            g++-aarch64-linux-gnu \
            g++-riscv64-linux-gnu \
            ninja-build \
            nlohmann-json3-dev \
            python3-venv

          # CGX requires CMake 4.3 or newer. Keep the CI version explicit so
          # the LLVM and analyzer caches are reproducible.
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            "cmake==4.4.5"
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Record toolchain versions
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "cmake=$(cmake --version | awk 'NR == 1 { print $3 }')" >> "$GITHUB_OUTPUT"
          echo "gcc=$(g++ -dumpfullversion -dumpversion)" >> "$GITHUB_OUTPUT"
          echo "ninja=$(ninja --version)" >> "$GITHUB_OUTPUT"

      # The cached artifact is the statically linked llvm-mca executable at the
      # exact path expected by CGX. Bump the v1 suffix if LLVM build options change.
      - name: Restore LLVM llvm-mca cache
        id: llvm-cache
        uses: actions/cache@v6.1.0
        with:
          path: CGX/external-bin/llvm
          key: llvm-mca-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-llvmorg-23.1.1-gcc-${{ steps.toolchain.outputs.gcc }}-cmake-${{ steps.toolchain.outputs.cmake }}-x86-aarch64-riscv-release-v1

      - name: Checkout LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: llvm/llvm-project
          ref: llvmorg-23.1.1
          path: llvm-project
          fetch-depth: 1
          persist-credentials: false

      - name: Build llvm-mca
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cmake -S llvm-project/llvm -B llvm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;RISCV" \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_BUILD_LLVM_DYLIB=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF

          cmake --build llvm-build --target llvm-mca --parallel 2
          install -D -m 0755 \
            llvm-build/bin/llvm-mca \
            CGX/external-bin/llvm/bin/llvm-mca

      - name: Verify llvm-mca
        shell: bash
        run: |
          set -euo pipefail
          test -x CGX/external-bin/llvm/bin/llvm-mca
          CGX/external-bin/llvm/bin/llvm-mca --version

      # CMake's build tree contains the analyzer binary and Ninja dependency
      # data. A unique key lets each run save its updated tree; restore-keys
      # recovers the latest compatible tree for incremental builds.
      - name: Restore analyzer build cache
        uses: actions/cache@v6.1.0
        with:
          path: CGX/build
          key: analyzer-build-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-gcc-${{ steps.toolchain.outputs.gcc }}-cmake-${{ steps.toolchain.outputs.cmake }}-ninja-${{ steps.toolchain.outputs.ninja }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            analyzer-build-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-gcc-${{ steps.toolchain.outputs.gcc }}-cmake-${{ steps.toolchain.outputs.cmake }}-ninja-${{ steps.toolchain.outputs.ninja }}-

      - name: Initialize CGX submodules
        shell: bash
        run: |
          set -euo pipefail

          # CGX's y9inc submodule uses an SSH URL, but the repository is public.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git -C CGX submodule update --init --recursive

      - name: Build analyzer
        working-directory: CGX
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build build --target analyzer --parallel 2

      - name: Generate assembly for every experiment
        working-directory: CGX
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' sources < <(
            find ../CGX-data/experiments \
              -mindepth 2 -maxdepth 2 \
              -type f -name source.cpp -print0 | sort -z
          )

          if (( ${#sources[@]} == 0 )); then
            echo "::error::No experiments/*/source.cpp files were found."
            exit 1
          fi

          for source in "${sources[@]}"; do
            experiment="${source#../CGX-data/experiments/}"
            experiment="${experiment%/source.cpp}"
            echo "::group::Generate assembly: ${experiment}"
            python3 run.py "${experiment}"
            echo "::endgroup::"
          done

      - name: Run llvm-mca for every experiment
        working-directory: CGX
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' sources < <(
            find ../CGX-data/experiments \
              -mindepth 2 -maxdepth 2 \
              -type f -name source.cpp -print0 | sort -z
          )

          for source in "${sources[@]}"; do
            experiment="${source#../CGX-data/experiments/}"
            experiment="${experiment%/source.cpp}"
            echo "::group::Run llvm-mca: ${experiment}"
            ./build/analyzer batchMca "${experiment}"
            echo "::endgroup::"
          done

      - name: Copy generated assembly and MCA JSON to test
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' generated_files < <(
            find CGX-data/experiments -type f \
              \( -path '*/asm/*.s' -o -path '*/mca/json/*.json' \) \
              -print0 | sort -z
          )

          if (( ${#generated_files[@]} == 0 )); then
            echo "::error::No generated assembly or MCA JSON files were found."
            exit 1
          fi

          for generated in "${generated_files[@]}"; do
            relative="${generated#CGX-data/}"
            destination="CGX-data-test/${relative}"
            mkdir -p "$(dirname "${destination}")"
            cp -- "${generated}" "${destination}"
          done

      - name: Commit and push results to test
        working-directory: CGX-data-test
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- experiments

          if git diff --cached --quiet; then
            echo "Generated assembly and MCA JSON are unchanged; no commit is necessary."
            exit 0
          fi

          git commit -m "chore: regenerate assembly and MCA [skip ci]"
          git push origin HEAD:test
